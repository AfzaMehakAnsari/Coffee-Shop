<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bean &amp; Brew Coffee Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top">Bean &amp; Brew</a>
    <button class="cart-btn" id="openCart" aria-label="Open cart">
      Cart <span id="cartCount">0</span>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Fresh coffee,<br>brewed to order.</h1>
      <p>Pick your drink, add it to the cart, and we’ll have it ready at the counter.</p>
      <a class="btn" href="#menu">See the menu</a>
    </section>

    <section id="menu" class="menu">
      <h2>Menu</h2>
      <input type="search" id="search" class="search" placeholder="Search drinks and snacks" aria-label="Search the menu">
      <div class="filters" id="filters"></div>
      <div class="grid" id="menuGrid"></div>
    </section>
  </main>

  <footer>© 2026 Bean &amp; Brew · Open daily 8am – 10pm</footer>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your order</h2>
      <button id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <ul id="cartItems"></ul>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><strong id="cartTotal">Rs 0</strong></div>
      <button class="btn" id="checkout">Place order</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
